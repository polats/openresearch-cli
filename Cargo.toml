[package]
name = "openresearch-cli"
# Crux versions on its own 1.x line, deliberately above upstream's 0.1.x.
#
# Upstream's version travels in `Cargo.toml`, so every sync tranche used to drag
# its bump along — and `release-on-bump.yml` reads any unreleased version on
# main as "release this", which is how a cherry-picked 0.1.87 → 0.1.89 once
# dispatched a release nobody asked for. Sitting above 0.1.x makes that
# self-correcting: an inherited 0.1.9x is now a *backwards* move, which CI's
# version-guard rejects outright. Take upstream's code, never its version.
version = "1.0.0"
edition = "2021"
description = "Crux — from a game idea to a validated, playable prototype (crux)"
repository = "https://github.com/trinity-asylum/crux"
license = "MIT"
default-run = "crux"

# `crux` is the command; `orx` stays as an alias (same binary) so existing
# scripts and the ~800 `orx …` references in agent playbooks keep working.
[[bin]]
name = "crux"
path = "src/main.rs"

[[bin]]
name = "orx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "fs", "process", "sync", "signal"] }
# rustls instead of the default native-tls: avoids an OpenSSL dependency so the
# static musl Linux builds link cleanly (native-tls/openssl won't build for musl).
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
dirs = "5"
# bundled: compiles SQLite from source so the static musl builds link cleanly
# (same reasoning as rustls above — no system library dependency).
rusqlite = { version = "0.32", features = ["bundled"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
semver = "1"
fd-lock = "4"
base64 = "0.22"
# `orx up` dashboard: axum for routing/SSE, rust-embed for the SPA, futures for
# the stream plumbing. TLS-free, so the rustls-only musl build stays intact.
axum = "0.8"
rust-embed = "8"
futures = "0.3"
# async fns in the Harness trait (object-safe `dyn Harness` in the registry).
async-trait = "0.1"
# MCP client for the Scenario bridge (`local::scenario`). `reqwest` is the
# feature that turns on rustls — `transport-streamable-http-client-reqwest` only
# adds the dependency (`__reqwest`), so without it every https URL fails at
# connect with "invalid URL, scheme is not http". Deliberately the rustls flavor,
# not `reqwest-native-tls`, so no OpenSSL enters the tree and the static musl
# release builds keep linking.
rmcp = { version = "3.1.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }

[target.'cfg(unix)'.dependencies]
# Free-space pre-check for the data-dir move (statvfs). Already in the tree
# transitively; taken as a direct dep only on unix, where we call it.
libc = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
